<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 18px;
      font-family: Arial, sans-serif;
      color: #effff1;
      background: radial-gradient(circle at top, #21462b, #08140c 65%);
    }
    .game { width: min(94vw, 520px); text-align: center; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: .08em; }
    .topbar { display: flex; justify-content: space-between; margin: 0 0 14px; font-weight: bold; }
    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 4px solid #76e58a;
      border-radius: 12px;
      background-color: #102917;
      background-image: linear-gradient(#183a20 1px, transparent 1px), linear-gradient(90deg, #183a20 1px, transparent 1px);
      background-size: 5% 5%;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-size: clamp(1.25rem, 5vw, 2rem);
      font-weight: bold;
      background: rgba(5, 17, 8, .68);
      cursor: pointer;
    }
    .hidden { display: none; }
    .controls { margin: 16px 0 10px; color: #c7e8cd; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 20px;
      font: inherit;
      font-weight: bold;
      color: #08200d;
      background: #76e58a;
      cursor: pointer;
    }
    button:hover { background: #9cf4aa; }
    .touch-controls { display: none; grid-template-columns: repeat(3, 62px); justify-content: center; gap: 8px; margin-top: 18px; }
    .touch-controls button { min-height: 54px; padding: 12px; font-size: 1.25rem; touch-action: manipulation; }
    .up { grid-column: 2; }
    @media (max-width: 600px), (pointer: coarse) { .touch-controls { display: grid; } }
    @media (max-width: 420px) {
      body { padding: 10px; place-items: start center; }
      h1 { margin-top: 2px; }
      .topbar { margin-bottom: 8px; }
      .board { border-width: 3px; border-radius: 9px; }
      .controls { margin: 10px 0 8px; font-size: .9rem; }
      #restart { padding: 9px 16px; }
      .touch-controls { margin-top: 12px; grid-template-columns: repeat(3, 58px); }
      .touch-controls button { min-height: 50px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>SNAKE</h1>
    <div class="topbar"><span>Score: <span id="score">0</span></span><span>Best: <span id="best">0</span></span></div>
    <div class="board">
      <canvas id="gameCanvas" width="500" height="500" aria-label="Snake game"></canvas>
      <div id="message" class="message">Press an arrow key<br>to start</div>
    </div>
    <p class="controls">Use Arrow Keys or WASD to move</p>
    <button id="restart">Restart Game</button>
    <div class="touch-controls" aria-label="Touch controls">
      <button class="up" data-dir="up">▲</button>
      <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const message = document.getElementById('message');
    const size = 20, tiles = canvas.width / size;
    let snake, food, direction, nextDirection, score, timer, running;
    let best = Number(localStorage.getItem('snakeBest') || 0);
    bestEl.textContent = best;

    function newFood() {
      do {
        food = { x: Math.floor(Math.random() * tiles), y: Math.floor(Math.random() * tiles) };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function reset() {
      clearInterval(timer);
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      direction = nextDirection = { x: 1, y: 0 };
      score = 0; scoreEl.textContent = score;
      running = false;
      newFood(); draw();
      message.innerHTML = 'Press an arrow key<br>to start';
      message.classList.remove('hidden');
    }

    function start() {
      if (running) return;
      running = true; message.classList.add('hidden');
      timer = setInterval(update, 110);
    }

    function vibrate(pattern) {
      if ('vibrate' in navigator) navigator.vibrate(pattern);
    }

    function update() {
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      const hitWall = head.x < 0 || head.x >= tiles || head.y < 0 || head.y >= tiles;
      const hitSelf = snake.some(part => part.x === head.x && part.y === head.y);
      if (hitWall || hitSelf) return gameOver();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10; scoreEl.textContent = score;
        vibrate(40);
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snakeBest', best); }
        newFood();
      } else snake.pop();
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff5964';
      ctx.beginPath(); ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size * .36, 0, Math.PI * 2); ctx.fill();
      snake.forEach((part, i) => {
        ctx.fillStyle = i === 0 ? '#c7ff75' : '#75df7d';
        ctx.fillRect(part.x * size + 2, part.y * size + 2, size - 4, size - 4);
      });
    }

    function gameOver() {
      clearInterval(timer); running = false;
      vibrate([100, 60, 160]);
      message.innerHTML = `Game Over<br><small>Score: ${score} — click to restart</small>`;
      message.classList.remove('hidden');
    }

    function setDirection(name) {
      const directions = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
      const d = directions[name];
      if (!d || (d.x === -direction.x && d.y === -direction.y)) return;
      nextDirection = d; start();
    }

    document.addEventListener('keydown', event => {
      const keys = { ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down', ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right' };
      if (keys[event.key]) { event.preventDefault(); setDirection(keys[event.key]); }
    });
    document.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        setDirection(button.dataset.dir);
      });
    });
    document.getElementById('restart').addEventListener('click', reset);
    message.addEventListener('click', reset);
    reset();
  </script>
</body>
</html>
